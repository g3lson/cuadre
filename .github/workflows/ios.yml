name: iOS · compilar y capturar

# Compila la app de verdad y la arranca en un simulador para sacar capturas.
# Corre en GitHub Actions, que es gratis mientras el repositorio sea público, y
# así no se gastan los minutos de Codemagic en descubrir que falta una coma.
#
# No firma nada: build de simulador con la firma desactivada.

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      tema:
        description: 'Tema con el que arrancar las capturas (barro, mercado, noche)'
        required: false
        default: 'barro'

jobs:
  # ARCHIVAR, COMO LO HACE CODEMAGIC.
  #
  # El otro trabajo compila en Debug para el simulador; esto archiva en Release
  # para un dispositivo, que es lo que de verdad se sube. No es lo mismo: Release
  # compila el módulo entero de una vez y saca errores que Debug no ve, y el
  # destino de dispositivo comprueba cosas del paquete que el simulador se salta.
  #
  # Va sin firmar: lo único que no se puede probar aquí son los certificados.
  archivo:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Usar el Xcode más nuevo que haya
        # Codemagic va con Xcode 26. Aquí se coge el más alto que traiga la
        # máquina para que compile lo mismo: sin el SDK de iOS 26, el trozo de
        # Apple Intelligence se descarta con `canImport` y nunca se comprueba.
        run: |
          ls -d /Applications/Xcode*.app
          NUEVO=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "→ $NUEVO"
          sudo xcode-select -s "$NUEVO"
          xcodebuild -version

      - name: Comprobar que el plist y los permisos están bien formados
        run: |
          plutil -lint ios/Cuadre/Info.plist
          plutil -lint ios/Cuadre/Cuadre.entitlements

      - name: Archivar en Release, sin firmar
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/Cuadre.xcodeproj \
            -scheme Cuadre \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Cuadre.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive 2>&1 | tee archivado.txt | grep -E "error:|warning:|ARCHIVE|BUILD" || true
          if ! grep -q "ARCHIVE SUCCEEDED" archivado.txt; then
            echo "::error::El archivado falló"
            grep -E "error:" archivado.txt | head -40
            exit 1
          fi
          echo "── lo que quedó dentro ──"
          ls -la build/Cuadre.xcarchive/Products/Applications/*.app | head
          /usr/libexec/PlistBuddy -c "Print" build/Cuadre.xcarchive/Products/Applications/Cuadre.app/Info.plist | head -40

      - name: Subir el registro si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: registro-archivado
          path: archivado.txt

  simulador:
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Usar el Xcode más nuevo que haya
        # Codemagic va con Xcode 26. Aquí se coge el más alto que traiga la
        # máquina para que compile lo mismo: sin el SDK de iOS 26, el trozo de
        # Apple Intelligence se descarta con `canImport` y nunca se comprueba.
        run: |
          ls -d /Applications/Xcode*.app
          NUEVO=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "→ $NUEVO"
          sudo xcode-select -s "$NUEVO"
          xcodebuild -version

      - name: Ver qué Xcode hay
        run: xcodebuild -version && xcrun simctl list runtimes | head -20

      - name: Compilar para simulador
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/Cuadre.xcodeproj \
            -scheme Cuadre \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee compilacion.txt | grep -E "error:|warning:|BUILD" || true
          # `tee` se come el código de salida de xcodebuild, así que se comprueba aparte.
          if ! grep -q "BUILD SUCCEEDED" compilacion.txt; then
            echo "::error::La compilación falló"
            grep -E "error:" compilacion.txt | head -40
            exit 1
          fi

      - name: Arrancar el simulador e instalar
        run: |
          set -e
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          echo "APP=$APP" >> $GITHUB_ENV
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 1[6-9]|iPhone 1[6-9] Pro" | head -1 \
                 | grep -oE "[0-9A-Fa-f-]{36}")
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available | grep -oE "[0-9A-Fa-f-]{36}" | head -1)
          fi
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true
          xcrun simctl install "$UDID" "$APP"

      - name: Lanzar y capturar cada pestaña
        # La app arranca con `-demo`: entra sin servidor y se siembra con un día
        # de trabajo. Sin eso, lo único que se puede fotografiar es la pantalla
        # de entrar, que es justo la que menos dice.
        run: |
          set -e
          APLICACION=do.com.fente.cuadre

          xcrun simctl spawn "$UDID" log stream --level debug --style compact \
            --predicate 'processImagePath CONTAINS "Cuadre"' > registro-simulador.txt 2>&1 &
          LOGPID=$!

          captura() {   # captura <nombre> <pestaña> [hoja] [tema]
            xcrun simctl terminate "$UDID" "$APLICACION" 2>/dev/null || true
            sleep 1
            xcrun simctl launch "$UDID" "$APLICACION" -demo \
              -pestana "$2" -abre "${3:-nada}" -tema "${4:-barro}" >/dev/null || true
            sleep "${ESPERA:-6}"
            xcrun simctl io "$UDID" screenshot "captura-$1.png" || true
            echo "  · $1"
          }

          # La primera arranca con la base vacía y hay que crearla: más margen.
          ESPERA=10 captura 01-listas listas
          captura 02-en-tienda tienda
          captura 03-ventas ventas
          captura 04-el-cuadre cuadre
          captura 05-ajustes ajustes

          # Las que se abren tocando algo.
          captura 06-nueva-lista listas nueva
          captura 07-ficha-producto tienda ficha
          captura 08-columnas tienda columnas
          captura 09-asistente tienda asistente
          captura 10-cerrar-compra tienda cerrar
          captura 11-nuevo-encargo ventas encargo
          captura 12-comprobante ventas comprobante
          captura 13-catalogo ajustes catalogo
          captura 14-chinola ajustes chinola
          captura 15-tu-cuenta ajustes cuenta
          captura 16-negocios ajustes grupos
          captura 17-el-negocio ajustes negocio
          captura 18-confirmar-cobro ventas confirmar
          captura 19-nueva-venta ventas evento
          captura 23-cuadre-semana cuadre semana

          # Los otros dos temas, para ver que el cambio es solo de tokens.
          captura 20-mercado tienda nada mercado
          captura 21-noche tienda nada noche
          captura 22-noche-cuadre cuadre nada noche

          # Y la de entrar, que es la primera que ve alguien nuevo.
          xcrun simctl terminate "$UDID" "$APLICACION" 2>/dev/null || true
          xcrun simctl uninstall "$UDID" "$APLICACION" || true
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" "$APLICACION" >/dev/null || true
          sleep 6
          xcrun simctl io "$UDID" screenshot "captura-00-entrar.png" || true

          kill $LOGPID 2>/dev/null || true
          echo "── errores en el registro, si los hubo ──"
          grep -iE "fault|crash|exception|error" registro-simulador.txt | head -20 || echo "(ninguno)"

      - name: Y el iPad, que es otra app
        # La misma app en una pantalla grande no es la misma app: las pestañas
        # pasan a un raíl de lado y el contenido deja de estirarse. Si eso se
        # rompe, no se ve en ninguna captura de iPhone.
        continue-on-error: true
        run: |
          set -e
          APLICACION=do.com.fente.cuadre
          TABLETA=$(xcrun simctl list devices available | grep -E "iPad Pro|iPad Air|iPad \(" | head -1 \
                    | grep -oE "[0-9A-Fa-f-]{36}")
          if [ -z "$TABLETA" ]; then echo "(sin iPad disponible)"; exit 0; fi
          xcrun simctl boot "$TABLETA" || true
          xcrun simctl bootstatus "$TABLETA" -b || true
          xcrun simctl install "$TABLETA" "$APP"
          for par in "30-ipad-listas listas" "31-ipad-ventas ventas" "32-ipad-cuadre cuadre"; do
            set -- $par
            xcrun simctl terminate "$TABLETA" "$APLICACION" 2>/dev/null || true
            sleep 1
            xcrun simctl launch "$TABLETA" "$APLICACION" -demo -pestana "$2" -tema barro >/dev/null || true
            sleep 8
            xcrun simctl io "$TABLETA" screenshot "captura-$1.png" || true
            echo "  · $1"
          done

      - name: Subir capturas y registros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-simulador
          path: |
            captura-*.png
            registro-simulador.txt
            compilacion.txt
          if-no-files-found: warn
          retention-days: 14
