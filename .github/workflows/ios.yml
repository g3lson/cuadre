name: iOS · compilar y capturar

# Compila la app de verdad y la arranca en un simulador para sacar capturas.
# Corre en GitHub Actions, que es gratis mientras el repositorio sea público, y
# así no se gastan los minutos de Codemagic en descubrir que falta una coma.
#
# No firma nada: build de simulador con la firma desactivada.

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      tema:
        description: 'Tema con el que arrancar las capturas (barro, mercado, noche)'
        required: false
        default: 'barro'

jobs:
  simulador:
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Ver qué Xcode hay
        run: xcodebuild -version && xcrun simctl list runtimes | head -20

      - name: Compilar para simulador
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/Cuadre.xcodeproj \
            -scheme Cuadre \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee compilacion.txt | grep -E "error:|warning:|BUILD" || true
          # `tee` se come el código de salida de xcodebuild, así que se comprueba aparte.
          if ! grep -q "BUILD SUCCEEDED" compilacion.txt; then
            echo "::error::La compilación falló"
            grep -E "error:" compilacion.txt | head -40
            exit 1
          fi

      - name: Arrancar el simulador e instalar
        run: |
          set -e
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          echo "APP=$APP" >> $GITHUB_ENV
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 1[6-9]|iPhone 1[6-9] Pro" | head -1 \
                 | grep -oE "[0-9A-Fa-f-]{36}")
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available | grep -oE "[0-9A-Fa-f-]{36}" | head -1)
          fi
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true
          xcrun simctl install "$UDID" "$APP"

      - name: Lanzar y capturar
        run: |
          set -e
          # El registro del sistema filtrado a la app, para cazar un fallo que no
          # se vea en la captura.
          xcrun simctl spawn "$UDID" log stream --level debug --style compact \
            --predicate 'processImagePath CONTAINS "Cuadre"' > registro-simulador.txt 2>&1 &
          LOGPID=$!

          xcrun simctl launch "$UDID" do.com.fente.cuadre || true
          sleep 5;  xcrun simctl io "$UDID" screenshot captura-01-arranque.png || true
          sleep 5;  xcrun simctl io "$UDID" screenshot captura-02-entrar.png || true
          sleep 6;  xcrun simctl io "$UDID" screenshot captura-03.png || true

          kill $LOGPID 2>/dev/null || true
          echo "── primeras líneas del registro ──"
          head -c 8000 registro-simulador.txt || true

      - name: Subir capturas y registros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-simulador
          path: |
            captura-*.png
            registro-simulador.txt
            compilacion.txt
          if-no-files-found: warn
          retention-days: 14
